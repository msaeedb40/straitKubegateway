# GitHub Actions workflow for building and deploying static Helm repository and landing page with Tailwind CSS v4 to GitHub Pages
name: Deploy straitKubegateway static content to Pages

on:
  # Runs on pushes targeting main or developer branches
  push:
    branches: ["main", "developer"]
    paths:
      - 'straitKubegateway-helm-repo/**'
      - 'scripts/publish-helm-repo.sh'
      - '.github/workflows/static.yml'
      - '.github/static.yml'
  release:
    types: [published]
  # Allows manual triggers from GitHub Actions UI
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm 
      


      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.0.0
      


      - name: Install dependencies
        run: npm ci


      - name: Build Chart Repository and Tailwind CSS v4 Static Landing Page
        run: |
          chmod +x scripts/publish-helm-repo.sh
          ./scripts/publish-helm-repo.sh dist/charts

      - name: Verify generated repository
        run: |
          test -f dist/charts/index.html
          test -f dist/charts/index.yaml
          test -f dist/charts/.nojekyll

          echo "Generated files:"
          find dist/charts -maxdepth 2 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload generated static repository containing index.html (Tailwind v4), index.yaml, packages, CNAME, and .nojekyll
          path: 'dist/charts'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
