name: straitKubegateway-charts

on:
  push:
    branches:
      - main
    paths:
      - 'straitKubegateway-helm-repo/**'
      - '.github/workflows/charts.yml'
      - 'scripts/publish-helm-repo.sh'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy-charts:
    name: Build and Host Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Build Chart Repository
        run: |
          chmod +x scripts/publish-helm-repo.sh
          ./scripts/publish-helm-repo.sh dist/charts

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/charts
          cname: charts.straitkubegateway.io
          keep_files: false
