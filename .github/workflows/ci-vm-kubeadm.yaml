name: ci-vm-kubeadm

on:
  push:
    branches:
      - main
      - developer
  pull_request:
    branches:
      - main
      - developer
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kubeadm-smoke-test:
    name: VM Kubeadm Host Smoke Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run unit tests (pre-requisite)
        run: go test -race -count=1 ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build amd64 images only for CI speed — multi-arch is tested in ci-build-load-image.yaml
      - name: Build straitd image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.straitd
          platforms: linux/amd64
          load: true
          tags: straitd:ci-${{ github.sha }}

      - name: Build sg-controller image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.sg-controller
          platforms: linux/amd64
          load: true
          tags: sg-controller:ci-${{ github.sha }}

      - name: Build sg-cli image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.sg-cli
          platforms: linux/amd64
          load: true
          tags: sg-cli:ci-${{ github.sha }}

      - name: Build UI image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.ui
          platforms: linux/amd64
          load: true
          tags: ui:ci-${{ github.sha }}

      - name: Prepare VM host networking and kernel settings
        run: |
          sudo swapoff -a
          sudo sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab

          cat <<EOF | sudo tee /etc/modules-load.d/k8s.conf
          overlay
          br_netfilter
          EOF

          sudo modprobe overlay
          sudo modprobe br_netfilter

          cat <<EOF | sudo tee /etc/sysctl.d/k8s.conf
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
          EOF

          sudo sysctl --system

      - name: Configure containerd CRI for Kubernetes
        run: |
          sudo mkdir -p /etc/containerd
          sudo containerd config default | sudo tee /etc/containerd/config.toml > /dev/null
          sudo sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
          sudo systemctl restart containerd
          sudo systemctl status containerd --no-pager

      - name: Install kubeadm, kubelet, and kubectl
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gpg

          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg

          echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.37/deb/ /' | sudo tee /etc/apt/sources.list.d/kubernetes.list

          sudo apt-get update
          sudo apt-get install -y kubelet kubeadm kubectl
          sudo apt-mark hold kubelet kubeadm kubectl

      - name: Initialize single-node kubeadm cluster (no kube-proxy)
        run: |
          sudo kubeadm init \
            --pod-network-cidr=10.244.0.0/16 \
            --skip-phases=addon/kube-proxy \
            --ignore-preflight-errors=NumCPU,Mem

          mkdir -p $HOME/.kube
          sudo cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
          sudo chown $(id -u):$(id -g) $HOME/.kube/config

          # Remove control-plane taint so straitKubegateway and workloads can schedule on single node
          kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true

      - name: Import built images into containerd k8s.io namespace
        run: |
          echo "Importing images into containerd k8s.io namespace..."
          docker save straitd:ci-${{ github.sha }}       | sudo ctr -n k8s.io images import -
          docker save sg-controller:ci-${{ github.sha }} | sudo ctr -n k8s.io images import -
          docker save sg-cli:ci-${{ github.sha }}        | sudo ctr -n k8s.io images import -
          docker save ui:ci-${{ github.sha }}            | sudo ctr -n k8s.io images import -

          sudo ctr -n k8s.io images list | grep -E "straitd|sg-controller|sg-cli|ui"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.0.0

      - name: Apply Gateway API CRDs v1.6.1
        run: |
          kubectl apply --server-side -f \
            https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml

      - name: Apply straitKubegateway CRDs
        run: |
          kubectl apply --server-side -f straitKubegateway-helm-repo/crds/

      - name: Wait for CRDs to be established
        run: |
          kubectl wait --for=condition=Established --timeout=120s \
            crd/gatewayclasses.gateway.networking.k8s.io \
            crd/gateways.gateway.networking.k8s.io \
            crd/httproutes.gateway.networking.k8s.io \
            crd/grpcroutes.gateway.networking.k8s.io \
            crd/tlsroutes.gateway.networking.k8s.io \
            crd/tcproutes.gateway.networking.k8s.io \
            crd/udproutes.gateway.networking.k8s.io \
            crd/referencegrants.gateway.networking.k8s.io \
            crd/straitnetworks.straitkubegateway.io \
            crd/straitnetworkpolicies.straitkubegateway.io \
            crd/straitnodes.straitkubegateway.io \
            crd/transitgateways.straitkubegateway.io

      - name: Helm lint straitKubegateway chart
        run: helm lint straitKubegateway-helm-repo

      - name: Install straitKubegateway via Helm
        run: |
          helm install straitkubegateway straitKubegateway-helm-repo \
            --namespace kube-system \
            --create-namespace \
            --set straitd.image.repository=straitd \
            --set straitd.image.tag=ci-${{ github.sha }} \
            --set straitd.image.pullPolicy=Never \
            --set sgController.image.repository=sg-controller \
            --set sgController.image.tag=ci-${{ github.sha }} \
            --set sgController.image.pullPolicy=Never \
            --set sgController.replicas=1 \
            --set ui.image.repository=ui \
            --set ui.image.tag=ci-${{ github.sha }} \
            --set ui.image.pullPolicy=Never \
            --set straitd.kubeProxyReplacement=true \
            --set straitd.kubeProxyMode=none \
            --set kubeProxyReplacement=true \
            --set kubeProxyMode=none \
            --timeout=15m \
            --wait

      - name: Verify cluster node and workloads
        run: |
          echo "Waiting for host node to become Ready..."
          kubectl wait --for=condition=Ready nodes --all --timeout=180s || true
          kubectl get nodes -o wide
          echo "Waiting for CoreDNS pods to become Ready..."
          kubectl wait --for=condition=Ready -n kube-system pod -l k8s-app=kube-dns --timeout=180s || true
          kubectl get pods -A
          kubectl get crds

      - name: Verify Helm release status
        run: |
          helm list -n kube-system
          helm status straitkubegateway -n kube-system

      - name: Test helm upgrade --install (idempotency)
        run: |
          helm upgrade --install straitkubegateway straitKubegateway-helm-repo \
            --namespace kube-system \
            --set straitd.image.repository=straitd \
            --set straitd.image.tag=ci-${{ github.sha }} \
            --set straitd.image.pullPolicy=Never \
            --set sgController.image.repository=sg-controller \
            --set sgController.image.tag=ci-${{ github.sha }} \
            --set sgController.image.pullPolicy=Never \
            --set sgController.replicas=1 \
            --set ui.image.repository=ui \
            --set ui.image.tag=ci-${{ github.sha }} \
            --set ui.image.pullPolicy=Never \
            --set straitd.kubeProxyReplacement=true \
            --set straitd.kubeProxyMode=none \
            --set kubeProxyReplacement=true \
            --set kubeProxyMode=none \
            --timeout=15m \
            --wait

      - name: Verify final Helm release status
        run: |
          helm list -n kube-system
          helm status straitkubegateway -n kube-system

      - name: Debug cluster on failure
        if: failure()
        run: |
          echo "=== Nodes ==="
          kubectl get nodes -o wide
          echo "=== Pods ==="
          kubectl get pods -A -o wide
          echo "=== Describe Pods in kube-system ==="
          kubectl describe pods -n kube-system
          echo "=== Logs of sg-controller ==="
          kubectl logs -n kube-system -l app.kubernetes.io/component=controller --all-containers=true --tail=200 || true
          echo "=== Logs of straitd ==="
          kubectl logs -n kube-system -l app.kubernetes.io/component=node-agent --all-containers=true --tail=200 || true
          echo "=== Host Kernel dmesg (eBPF) ==="
          dmesg -T | grep -i -E "ebpf|bpf|strait|cni" | tail -n 100 || true
          echo "=== Kubelet Status & Logs ==="
          sudo journalctl -u kubelet -n 100 --no-pager || true
