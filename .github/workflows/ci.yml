name: straitKubegateway CI

on:
  push:
    branches: [ main, developer, "release/*" ]
  pull_request:
    branches: [ main, developer, "release/*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Go Vet & Format Check
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Helm Lint
        run: |
          helm lint straitKubegateway-helm

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  bpf-verify:
    name: BPF Kernel Programs Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install LLVM/Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev

      - name: Compile BPF Programs
        run: |
          make build-bpf

  test-go:
    name: Unit & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Run Tests with Race Detector
        run: |
          go test -v -race -coverprofile=coverage.out ./...

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage.out

  build-binaries:
    name: Multi-Arch Binary Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Build Binaries for linux/${{ matrix.arch }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bin/linux_${{ matrix.arch }}
          go build -ldflags="-s -w" -o bin/linux_${{ matrix.arch }}/straitd ./cmd/straitd
          go build -ldflags="-s -w" -o bin/linux_${{ matrix.arch }}/sg-controller ./cmd/sg-controller
          go build -ldflags="-s -w" -o bin/linux_${{ matrix.arch }}/sg-cli ./cmd/sg-cli
          go build -ldflags="-s -w" -o bin/linux_${{ matrix.arch }}/cni ./cni/plugin

  build-ui:
    name: Angular 22 UI Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install UI Dependencies
        working-directory: ./ui
        run: npm ci

      - name: Build Angular 22 Zoneless UI
        working-directory: ./ui
        run: npm run build

      - name: Upload UI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angular-ui-dist
          path: ui/dist/ui
