name: Continuous Integration

on:
  push:
    branches:
      - main
      - developer
  pull_request:
    branches:
      - main
      - developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-verify:
    name: Lint & Verification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify go.mod / go.sum tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

  security-scan:
    name: Security Scan (Trivy)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

  helm-lint:
    name: Helm Lint & Verification
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.0.0

      - name: Lint Helm Chart
        run: |
          helm lint straitKubegateway-helm-repo

      - name: Render and validate Helm templates (dry-run)
        run: |
          helm template straitkubegateway straitKubegateway-helm-repo \
            --set kubeProxyReplacement=true \
            --set kubeProxyMode=none

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run unit tests with race detector
        run: |
          go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check code coverage threshold
        run: |
          go tool cover -func=coverage.out | tail -n 1

  build-binaries:
    name: Multi-Arch Binary Builds
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build straitd (${{ matrix.arch }})
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -o bin/straitd-${{ matrix.arch }} ./cmd/straitd/

      - name: Build sg-controller (${{ matrix.arch }})
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -o bin/sg-controller-${{ matrix.arch }} ./cmd/sg-controller/

      - name: Build sg-cli (${{ matrix.arch }})
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -o bin/sg-cli-${{ matrix.arch }} ./cmd/sg-cli/
