name: straitKubegateway-ci

on:
  push:
    branches:
      - main
      - developer
  pull_request:
    branches:
      - main
      - developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-verify:
    name: Lint & Verification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify gofmt
        run: |
          diff -u <(echo -n) <(gofmt -s -d $(find . -type f -name '*.go' -not -path './vendor/*'))

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  security-scan:
    name: Security Scan (Trivy)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  helm-lint:
    name: Helm Lint & Verification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: |
          helm lint straitKubegateway-helm-repo

      - name: Render Helm Templates
        run: |
          helm template straitkubegateway straitKubegateway-helm-repo

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run unit tests
        run: |
          go test -race -coverprofile=coverage.out -count=1 ./...
          go tool cover -func=coverage.out

  build-binaries:
    name: Multi-Arch Binary Builds
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build straitd (${{ matrix.arch }})
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -o bin/straitd-${{ matrix.arch }} ./cmd/straitd/

      - name: Build sg-controller (${{ matrix.arch }})
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -o bin/sg-controller-${{ matrix.arch }} ./cmd/sg-controller/

      - name: Build sg-cli (${{ matrix.arch }})
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -o bin/sg-cli-${{ matrix.arch }} ./cmd/sg-cli/

  docker-build:
    name: Docker Build & Kind Smoke Test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build straitd image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.straitd
          platforms: linux/amd64
          load: true
          tags: straitd:ci

      - name: Build sg-controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.sg-controller
          platforms: linux/amd64
          load: true
          tags: sg-controller:ci

      - name: Build sg-cli image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.sg-cli
          platforms: linux/amd64
          load: true
          tags: sg-cli:ci

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.ui
          platforms: linux/amd64
          load: true
          tags: ui:ci

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-test

      - name: Load images into Kind
        run: |
          kind load docker-image straitd:ci --name ci-test
          kind load docker-image sg-controller:ci --name ci-test
          kind load docker-image sg-cli:ci --name ci-test
          kind load docker-image ui:ci --name ci-test

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install Gateway API & StraitKubeGateway CRDs
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml || true
          kubectl apply -f straitKubegateway-helm-repo/crds/

      - name: Install Helm chart
        run: |
          helm install straitkubegateway straitKubegateway-helm-repo \
            --set straitd.image.repository=straitd \
            --set straitd.image.tag=ci \
            --set sgController.image.repository=sg-controller \
            --set sgController.image.tag=ci \
            --set ui.image.repository=ui \
            --set ui.image.tag=ci

      - name: Verify cluster workloads & CRDs
        run: |
          kubectl get nodes -o wide
          kubectl get pods -A
          kubectl get crds

      - name: Test helm upgrade --install (idempotency)
        run: |
          helm upgrade --install straitkubegateway straitKubegateway-helm-repo \
            --set straitd.image.repository=straitd \
            --set straitd.image.tag=ci \
            --set sgController.image.repository=sg-controller \
            --set sgController.image.tag=ci \
            --set ui.image.repository=ui \
            --set ui.image.tag=ci

      - name: Verify Helm release status
        run: |
          helm list
          helm status straitkubegateway

  helm-install-test:
    name: Helm Chart Validation Test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: |
          helm lint straitKubegateway-helm-repo

      - name: Render and validate Helm templates (dry-run)
        run: |
          helm template straitkubegateway straitKubegateway-helm-repo
