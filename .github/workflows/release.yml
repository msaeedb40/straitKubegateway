name: straitKubegateway Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  publish-images:
    name: Build & Push Multi-Arch Container Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: straitd
            dockerfile: ./build/Dockerfile.straitd
          - name: sg-controller
            dockerfile: ./build/Dockerfile.sg-controller
          - name: sg-cli
            dockerfile: ./build/Dockerfile.sg-cli
          - name: ui
            dockerfile: ./build/Dockerfile.ui
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Tag and Registry Owner
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          # Convert repository owner to lowercase for OCI/GHCR compliance
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Build & Push ${{ matrix.name }} Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.name }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publish-helm:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest
    needs: publish-images
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Extract Tag and Registry Owner
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          CHART_VER="${TAG#v}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "chart_ver=${CHART_VER}" >> $GITHUB_OUTPUT
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Package Helm Chart
        run: |
          mkdir -p dist-chart
          helm package straitKubegateway-helm \
            --version "${{ steps.meta.outputs.chart_ver }}" \
            --app-version "${{ steps.meta.outputs.tag }}" \
            -d dist-chart/

      - name: Login to GHCR for OCI Helm Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Helm Chart to OCI Registry
        run: |
          for chart in dist-chart/*.tgz; do
            helm push "$chart" oci://ghcr.io/${{ steps.meta.outputs.owner }}/charts
          done

  github-release:
    name: Create GitHub Release & Upload Binary Assets
    runs-on: ubuntu-latest
    needs: publish-helm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Build Multi-Arch Binary Release Archives
        run: |
          mkdir -p release-assets
          for arch in amd64 arm64; do
            mkdir -p dist/linux_${arch}
            CGO_ENABLED=0 GOOS=linux GOARCH=${arch} go build -ldflags="-s -w" -o dist/linux_${arch}/straitd ./cmd/straitd
            CGO_ENABLED=0 GOOS=linux GOARCH=${arch} go build -ldflags="-s -w" -o dist/linux_${arch}/sg-controller ./cmd/sg-controller
            CGO_ENABLED=0 GOOS=linux GOARCH=${arch} go build -ldflags="-s -w" -o dist/linux_${arch}/sg-cli ./cmd/sg-cli
            CGO_ENABLED=0 GOOS=linux GOARCH=${arch} go build -ldflags="-s -w" -o dist/linux_${arch}/cni ./cni/plugin
            
            tar -czvf release-assets/straitKubegateway-linux-${arch}.tar.gz -C dist/linux_${arch} straitd sg-controller sg-cli cni
          done

      - name: Package Helm Chart for Release Asset
        run: |
          helm package straitKubegateway-helm -d release-assets/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
