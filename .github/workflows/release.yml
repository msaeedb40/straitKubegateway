name: straitKubegateway-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/straitd
            ghcr.io/${{ github.repository_owner }}/sg-controller
            ghcr.io/${{ github.repository_owner }}/sg-cli
            ghcr.io/${{ github.repository_owner }}/ui

      - name: Build and push straitd image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/Dockerfile.straitd
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/straitd:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/straitd:latest

      - name: Build and push sg-controller image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/Dockerfile.sg-controller
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sg-controller:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/sg-controller:latest

      - name: Build and push sg-cli image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/Dockerfile.sg-cli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sg-cli:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/sg-cli:latest

      - name: Build and push UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/Dockerfile.ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ui:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/ui:latest

      - name: Build release binaries (amd64, arm64)
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/straitkubegateway/straitkubegateway/internal/version.Version=${{ github.ref_name }}" \
              -o dist/straitd-${{ github.ref_name }}-linux-$arch ./cmd/straitd/
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/straitkubegateway/straitkubegateway/internal/version.Version=${{ github.ref_name }}" \
              -o dist/sg-controller-${{ github.ref_name }}-linux-$arch ./cmd/sg-controller/
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/straitkubegateway/straitkubegateway/internal/version.Version=${{ github.ref_name }}" \
              -o dist/sg-cli-${{ github.ref_name }}-linux-$arch ./cmd/sg-cli/
          done
          cd dist && sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
