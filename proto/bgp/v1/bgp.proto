syntax = "proto3";

package bgp.v1;

option go_package = "github.com/straitKubegateway/straitKubegateway/proto/bgp/v1;bgpv1";

import "common/v1/common.proto";

// BGPService manages BGP peering sessions and route advertisements.
service BGPService {
  rpc ListPeers(ListPeersRequest) returns (ListPeersResponse);
  rpc GetPeerStatus(GetPeerStatusRequest) returns (GetPeerStatusResponse);
}

message ListPeersRequest {}

message ListPeersResponse {
  repeated PeerSummary peers = 1;
}

message PeerSummary {
  string peer_address = 1;
  uint32 peer_asn = 2;
  uint32 local_asn = 3;
  string session_state = 4;
  int32 received_prefixes = 5;
  int32 advertised_prefixes = 6;
  int64 uptime_seconds = 7;
  bool bfd_enabled = 8;
  common.v1.HealthState health = 9;
}

message GetPeerStatusRequest {
  string peer_address = 1;
}

message GetPeerStatusResponse {
  PeerSummary summary = 1;
  repeated string advertised_routes = 2;
  repeated string learned_routes = 3;
}
