syntax = "proto3";

package common.v1;

option go_package = "github.com/straitKubegateway/straitKubegateway/proto/common/v1;commonv1";

import "google/protobuf/timestamp.proto";

// HealthState represents the health status of a component or service.
enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_HEALTHY = 1;
  HEALTH_STATE_DEGRADED = 2;
  HEALTH_STATE_UNHEALTHY = 3;
}

// IPFamily represents IPv4 or IPv6.
enum IPFamily {
  IP_FAMILY_UNSPECIFIED = 0;
  IP_FAMILY_IPV4 = 1;
  IP_FAMILY_IPV6 = 2;
}

// Protocol represents the L4 transport protocol.
enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_TCP = 6;
  PROTOCOL_UDP = 17;
  PROTOCOL_ICMP = 1;
}

// TrafficDirection represents ingress or egress traffic.
enum TrafficDirection {
  TRAFFIC_DIRECTION_UNSPECIFIED = 0;
  TRAFFIC_DIRECTION_INGRESS = 1;
  TRAFFIC_DIRECTION_EGRESS = 2;
}

// TelemetryContext carries unified observability metadata.
message TelemetryContext {
  google.protobuf.Timestamp timestamp = 1;
  string service_name = 2;
  string component = 3;
  string version = 4;
  string cluster_id = 5;
  string node_id = 6;
  string namespace = 7;
  string pod_name = 8;
  string gateway_id = 9;
  string tunnel_id = 10;
  string flow_id = 11;
  uint32 segment_id = 12;
  string trace_id = 13;
  string span_id = 14;
  string request_id = 15;
  string operation = 16;
  double duration_ms = 17;
}

// LatencyPercentiles provides P95/P99 latency measurements.
message LatencyPercentiles {
  double min_ms = 1;
  double p95_ms = 2;
  double p99_ms = 3;
  double max_ms = 4;
  int64 count = 5;
}

// TrafficMetrics provides throughput and packet counters.
message TrafficMetrics {
  uint64 rx_bytes_per_sec = 1;
  uint64 tx_bytes_per_sec = 2;
  uint64 rx_packets_per_sec = 3;
  uint64 tx_packets_per_sec = 4;
  uint64 drops_per_sec = 5;
}
