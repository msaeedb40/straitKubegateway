syntax = "proto3";

package dataplane.v1;

option go_package = "github.com/straitKubegateway/straitKubegateway/proto/dataplane/v1;dataplanev1";

import "common/v1/common.proto";

// DataplaneService manages BPF maps and low-level dataplane state.
service DataplaneService {
  rpc GetDataplaneStatus(GetDataplaneStatusRequest) returns (GetDataplaneStatusResponse);
  rpc DumpBPFMaps(DumpBPFMapsRequest) returns (DumpBPFMapsResponse);
}

message GetDataplaneStatusRequest {
  string node_id = 1;
}

message GetDataplaneStatusResponse {
  common.v1.HealthState health = 1;
  string kernel_version = 2;
  bool xdp_enabled = 3;
  bool tcx_enabled = 4;
  bool netkit_enabled = 5;
  int32 total_bpf_maps = 6;
  int32 total_bpf_programs = 7;
  common.v1.TrafficMetrics metrics = 8;
}

message DumpBPFMapsRequest {
  string map_name = 1;
  int32 max_entries = 2;
}

message DumpBPFMapsResponse {
  string map_name = 1;
  int32 entry_count = 2;
  repeated BPFMapEntry entries = 3;
}

message BPFMapEntry {
  bytes key = 1;
  bytes value = 2;
  string formatted_key = 3;
  string formatted_value = 4;
}
