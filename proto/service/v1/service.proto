syntax = "proto3";

package service.v1;

option go_package = "github.com/straitKubegateway/straitKubegateway/proto/service/v1;servicev1";

import "common/v1/common.proto";

// LoadBalancingAlgorithm represents the LB algorithm.
enum LBAlgorithm {
  LB_ALGORITHM_UNSPECIFIED = 0;
  LB_ALGORITHM_ROUND_ROBIN = 1;
  LB_ALGORITHM_WEIGHTED_ROUND_ROBIN = 2;
  LB_ALGORITHM_MAGLEV_HASH = 3;
  LB_ALGORITHM_LEAST_CONNECTIONS = 4;
  LB_ALGORITHM_IP_HASH = 5;
  LB_ALGORITHM_RANDOM = 6;
  LB_ALGORITHM_FAILOVER = 7;
}

// ServiceLBService manages Service load-balancing state.
service ServiceLBService {
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  rpc GetServiceBackends(GetServiceBackendsRequest) returns (GetServiceBackendsResponse);
}

message ListServicesRequest {
  string namespace = 1;
}

message ListServicesResponse {
  repeated ServiceInfo services = 1;
  int32 total_count = 2;
}

message ServiceInfo {
  string name = 1;
  string namespace = 2;
  string cluster_ip = 3;
  repeated ServicePort ports = 4;
  LBAlgorithm algorithm = 5;
  int32 backend_count = 6;
}

message ServicePort {
  string name = 1;
  common.v1.Protocol protocol = 2;
  int32 port = 3;
  int32 target_port = 4;
  int32 node_port = 5;
}

message GetServiceBackendsRequest {
  string namespace = 1;
  string service_name = 2;
}

message GetServiceBackendsResponse {
  repeated BackendInfo backends = 1;
}

message BackendInfo {
  string ip = 1;
  int32 port = 2;
  string node_name = 3;
  int32 weight = 4;
  bool healthy = 5;
  uint64 active_connections = 6;
}
