syntax = "proto3";

package transit.v1;

import "common/v1/common.proto";

option go_package = "github.com/straitkubegateway/straitkubegateway/proto/transit/v1;transitv1";

service TransitService {
  rpc SyncSegments(TransitSyncRequest) returns (TransitSyncResponse);
}

message TransitSyncRequest {
  uint64 generation = 1;
  repeated SegmentConfig segments = 2;
}

message SegmentConfig {
  uint32 segment_id = 1;
  string topology = 2;
  repeated PeerCluster peers = 3;
  repeated SegmentRoute routes = 4;
}

message PeerCluster {
  string cluster_name = 1;
  string endpoint = 2;
  uint32 port = 3;
  repeated string pod_cidrs = 4;
  repeated string service_cidrs = 5;
}

message SegmentRoute {
  string destination_cidr = 1;
  string next_hop = 2;
}

message TransitSyncResponse {
  bool success = 1;
  uint32 active_segments = 2;
}
