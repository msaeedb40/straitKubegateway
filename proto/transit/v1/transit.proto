syntax = "proto3";

package transit.v1;

option go_package = "github.com/straitKubegateway/straitKubegateway/proto/transit/v1;transitv1";

import "common/v1/common.proto";

// TransitService manages multi-cluster transit routing and segments.
service TransitService {
  rpc ListTransitGateways(ListTransitGatewaysRequest) returns (ListTransitGatewaysResponse);
  rpc ListSegments(ListSegmentsRequest) returns (ListSegmentsResponse);
  rpc GetTransitTopology(GetTransitTopologyRequest) returns (GetTransitTopologyResponse);
}

message ListTransitGatewaysRequest {}

message ListTransitGatewaysResponse {
  repeated TransitGatewayInfo gateways = 1;
}

message TransitGatewayInfo {
  string id = 1;
  string name = 2;
  string topology = 3;
  uint32 segment_id = 4;
  int32 attached_clusters = 5;
  int32 active_tunnels = 6;
  common.v1.HealthState health = 7;
}

message ListSegmentsRequest {}

message ListSegmentsResponse {
  repeated SegmentInfo segments = 1;
}

message SegmentInfo {
  uint32 segment_id = 1;
  bool is_backbone = 2;
  bool is_isolated = 3;
  bool backbone_connected = 4;
  int32 endpoint_count = 5;
}

message GetTransitTopologyRequest {}

message GetTransitTopologyResponse {
  repeated TopologyNode nodes = 1;
  repeated TopologyEdge edges = 2;
}

message TopologyNode {
  string id = 1;
  string label = 2;
  string type = 3; // cluster, gateway, segment
  uint32 segment_id = 4;
}

message TopologyEdge {
  string source_id = 1;
  string target_id = 2;
  string type = 3; // tunnel, backbone, peer
  common.v1.LatencyPercentiles latency = 4;
  common.v1.TrafficMetrics traffic = 5;
}
