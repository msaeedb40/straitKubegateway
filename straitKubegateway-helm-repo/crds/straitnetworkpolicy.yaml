apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: straitnetworkpolicies.straitkubegateway.io
spec:
  group: straitkubegateway.io
  names:
    kind: StraitNetworkPolicy
    listKind: StraitNetworkPolicyList
    plural: straitnetworkpolicies
    singular: straitnetworkpolicy
    shortNames:
      - snp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [policyTypes, endpointSelector]
              properties:
                policyTypes:
                  type: array
                  items:
                    type: string
                    enum: [Ingress, Egress]
                priority:
                  type: integer
                  minimum: 0
                  maximum: 255
                  default: 100
                endpointSelector:
                  type: object
                  properties:
                    podSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    namespaceSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    clusterSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    segmentSelector:
                      type: object
                      properties:
                        segmentID:
                          type: integer
                    gatewaySelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    httprouteSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    tcprouteSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    udprouteSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    grpcrouteSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    tlsrouteSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                ingress:
                  type: array
                  items:
                    type: object
                    properties:
                      action:
                        type: string
                        enum: [Allow, Deny, Reject]
                        default: Allow
                egress:
                  type: array
                  items:
                    type: object
                    properties:
                      action:
                        type: string
                        enum: [Allow, Deny, Reject]
                        default: Allow
            status:
              type: object
              properties:
                phase:
                  type: string
                observedGeneration:
                  type: integer
                enforcedNodes:
                  type: integer
      subresources:
        status: {}
