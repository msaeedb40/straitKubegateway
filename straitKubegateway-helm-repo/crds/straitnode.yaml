apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: straitnodes.straitkubegateway.io
spec:
  group: straitkubegateway.io
  names:
    kind: StraitNode
    listKind: StraitNodeList
    plural: straitnodes
    singular: straitnode
    shortNames:
      - snode
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [nodeName]
              properties:
                nodeName:
                  type: string
                podCIDR:
                  type: string
                ipv6PodCIDR:
                  type: string
                internalIP:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                observedGeneration:
                  type: integer
                cniReady:
                  type: boolean
                serviceReady:
                  type: boolean
                policyReady:
                  type: boolean
                gatewayReady:
                  type: boolean
                allocatedIdentities:
                  type: integer
                kernelVersion:
                  type: string
      subresources:
        status: {}
