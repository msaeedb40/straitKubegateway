apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: transitgateways.straitkubegateway.io
spec:
  group: straitkubegateway.io
  names:
    kind: TransitGateway
    listKind: TransitGatewayList
    plural: transitgateways
    singular: transitgateway
    shortNames:
      - tg
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                segmentID:
                  type: integer
                  minimum: 0
                  maximum: 4294967295
                  default: 0
                topology:
                  type: string
                  enum: [hub-spoke, mesh, peer-to-peer]
                  default: hub-spoke
                peers:
                  type: array
                  items:
                    type: object
                    required: [clusterName, endpoint]
                    properties:
                      clusterName:
                        type: string
                      endpoint:
                        type: string
                      port:
                        type: integer
                        default: 4789
                      podCIDRs:
                        type: array
                        items:
                          type: string
                      serviceCIDRs:
                        type: array
                        items:
                          type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                observedGeneration:
                  type: integer
                connectedPeers:
                  type: integer
      subresources:
        status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: transitsegmentattachments.straitkubegateway.io
spec:
  group: straitkubegateway.io
  names:
    kind: TransitSegmentAttachment
    listKind: TransitSegmentAttachmentList
    plural: transitsegmentattachments
    singular: transitsegmentattachment
    shortNames:
      - tsa
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [segmentID, peerSegmentID]
              properties:
                segmentID:
                  type: integer
                peerSegmentID:
                  type: integer
                routes:
                  type: array
                  items:
                    type: object
                    required: [cidr, nextHop]
                    properties:
                      cidr:
                        type: string
                      nextHop:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                observedGeneration:
                  type: integer
      subresources:
        status: {}
