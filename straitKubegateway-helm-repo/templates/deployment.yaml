apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "straitKubegateway-helm-repo.fullname" . }}-controller
  labels:
    {{- include "straitKubegateway-helm-repo.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.sgController.replicas }}
  selector:
    matchLabels:
      {{- include "straitKubegateway-helm-repo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "straitKubegateway-helm-repo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "straitKubegateway-helm-repo.fullname" . }}-controller
      {{- with .Values.sgController.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sgController.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- if .Values.sgController.tolerations }}
        {{- toYaml .Values.sgController.tolerations | nindent 8 }}
        {{- else }}
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        {{- end }}
      containers:
        - name: sg-controller
          image: "{{ .Values.sgController.image.repository }}:{{ .Values.sgController.image.tag }}"
          imagePullPolicy: {{ .Values.sgController.image.pullPolicy }}
          command:
            - /usr/local/bin/sg-controller
          args:
            - --leader-elect={{ .Values.sgController.leaderElection.enabled }}
            - --metrics-bind-address=:{{ .Values.sgController.metrics.port }}
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: {{ .Values.sgController.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.sgController.resources | nindent 12 }}
