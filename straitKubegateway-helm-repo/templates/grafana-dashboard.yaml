{{- if .Values.grafana.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "straitKubegateway-helm-repo.fullname" . }}-grafana-dashboard
  namespace: {{ .Values.grafana.dashboards.namespace | default .Release.Namespace }}
  labels:
    {{- include "straitKubegateway-helm-repo.labels" . | nindent 4 }}
    grafana_dashboard: "1"
    {{- with .Values.grafana.dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  straitkubegateway-overview.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "System & Node Agent Overview",
          "type": "row"
        },
        {
          "id": 1,
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "title": "Active straitd Daemons",
          "type": "stat",
          "targets": [
            { "expr": "count(up{job=~\".*straitd.*\"} == 1) or vector(0)", "legendFormat": "Nodes" }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          }
        },
        {
          "id": 2,
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "title": "Controller Replicas",
          "type": "stat",
          "targets": [
            { "expr": "count(up{job=~\".*controller.*\"} == 1) or vector(0)", "legendFormat": "Controllers" }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          }
        },
        {
          "id": 3,
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "title": "Active BFD Sessions",
          "type": "stat",
          "targets": [
            { "expr": "sum(straitkubegateway_bfd_session_state) or vector(0)", "legendFormat": "Sessions Up" }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "yellow", "value": null }, { "color": "blue", "value": 1 }] }
            }
          }
        },
        {
          "id": 4,
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "title": "Total BPF Map Entries",
          "type": "stat",
          "targets": [
            { "expr": "sum(straitkubegateway_bpf_map_entries) or vector(0)", "legendFormat": "Entries" }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 101,
          "title": "eBPF Dataplane & CNI Performance",
          "type": "row"
        },
        {
          "id": 5,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "title": "CNI Operations Rate",
          "type": "timeseries",
          "targets": [
            { "expr": "sum by (op) (rate(straitkubegateway_cni_operations_total[1m]))", "legendFormat": "{{ `{{ op }}` }}" }
          ]
        },
        {
          "id": 6,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "title": "BPF Map Operations / sec",
          "type": "timeseries",
          "targets": [
            { "expr": "sum by (op) (rate(straitkubegateway_bpf_map_operations_total[1m]))", "legendFormat": "{{ `{{ op }}` }}" }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "id": 102,
          "title": "Service Routing, Gateway API & Network Policies",
          "type": "row"
        },
        {
          "id": 7,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "title": "Network Policy Verdicts Rate",
          "type": "timeseries",
          "targets": [
            { "expr": "sum by (action) (rate(straitkubegateway_policy_evaluations_total[1m]))", "legendFormat": "{{ `{{ action }}` }}" }
          ]
        },
        {
          "id": 8,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "title": "IPAM Pool Utilization",
          "type": "timeseries",
          "targets": [
            { "expr": "straitkubegateway_ipam_allocated_ips", "legendFormat": "Allocated: {{ `{{ cidr }}` }}" },
            { "expr": "straitkubegateway_ipam_pool_capacity", "legendFormat": "Capacity: {{ `{{ cidr }}` }}" }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["straitkubegateway", "cni", "ebpf", "networking", "gateway-api"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s", "1m"] },
      "timezone": "browser",
      "title": "StraitKubeGateway / Dataplane & CNI Overview",
      "uid": "straitkubegateway-overview"
    }
{{- end }}
