{{- if .Values.gatewayAPI.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: {{ include "straitKubegateway-helm-repo.fullname" . }}-grpc-route
  labels:
    {{- include "straitKubegateway-helm-repo.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "straitKubegateway-helm-repo.fullname" . }}-gateway
      sectionName: grpc
  rules:
    - backendRefs:
        - name: {{ include "straitKubegateway-helm-repo.fullname" . }}-controller
          port: 8080
{{- end }}
