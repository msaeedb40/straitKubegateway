{{- if .Values.gatewayAPI.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "straitKubegateway-helm-repo.fullname" . }}-ui-route
  labels:
    {{- include "straitKubegateway-helm-repo.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "straitKubegateway-helm-repo.fullname" . }}-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "straitKubegateway-helm-repo.fullname" . }}-ui
          port: 80
{{- end }}
