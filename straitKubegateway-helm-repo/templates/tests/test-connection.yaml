apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "straitKubegateway-helm-repo.fullname" . }}-test-connection"
  labels:
    {{- include "straitKubegateway-helm-repo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "straitKubegateway-helm-repo.fullname" . }}-controller:{{ .Values.sgController.metrics.port }}/healthz']
  restartPolicy: Never
