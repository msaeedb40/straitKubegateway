{{- if .Values.gatewayAPI.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: {{ include "straitKubegateway-helm-repo.fullname" . }}-tls-route
  labels:
    {{- include "straitKubegateway-helm-repo.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "straitKubegateway-helm-repo.fullname" . }}-gateway
      sectionName: https
  hostnames:
    - "ui.straitkubegateway.local"
  rules:
    - backendRefs:
        - name: {{ include "straitKubegateway-helm-repo.fullname" . }}-ui
          port: 443
{{- end }}
