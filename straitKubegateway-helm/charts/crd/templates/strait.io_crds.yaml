apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gateways.strait.io
spec:
  group: strait.io
  names:
    kind: Gateway
    listKind: GatewayList
    plural: gateways
    singular: gateway
    shortNames:
      - sgw
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - segmentID
                - routingMode
              properties:
                segmentID:
                  type: integer
                  minimum: 0
                  maximum: 4294967295
                routingMode:
                  type: string
                  enum: [DirectRouting, Encapsulated, Hybrid]
                listeners:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - port
                      - protocol
                    properties:
                      name:
                        type: string
                      port:
                        type: integer
                        minimum: 1
                        maximum: 65535
                      protocol:
                        type: string
                      hostname:
                        type: string
                      tls:
                        type: object
                        properties:
                          mode:
                            type: string
                          certificateRef:
                            type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: straitnetworkpolicies.strait.io
spec:
  group: strait.io
  names:
    kind: StraitNetworkPolicy
    listKind: StraitNetworkPolicyList
    plural: straitnetworkpolicies
    singular: straitnetworkpolicy
    shortNames:
      - snp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - scope
                - priority
              properties:
                scope:
                  type: string
                  enum: [Cluster, Segment, Namespace]
                priority:
                  type: integer
                  minimum: 0
                  maximum: 65535
                segmentID:
                  type: integer
                  minimum: 0
                  maximum: 4294967295
                podSelector:
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                ingress:
                  type: array
                  items:
                    type: object
                    required:
                      - ruleNo
                      - action
                    properties:
                      ruleNo:
                        type: integer
                        minimum: 0
                        maximum: 4294967295
                      action:
                        type: string
                        enum: [Allow, Deny, Reject]
                      ports:
                        type: array
                        items:
                          type: object
                          properties:
                            port:
                              type: integer
                            protocol:
                              type: string
                      log:
                        type: boolean
                egress:
                  type: array
                  items:
                    type: object
                    required:
                      - ruleNo
                      - action
                    properties:
                      ruleNo:
                        type: integer
                        minimum: 0
                        maximum: 4294967295
                      action:
                        type: string
                        enum: [Allow, Deny, Reject]
                      ports:
                        type: array
                        items:
                          type: object
                          properties:
                            port:
                              type: integer
                            protocol:
                              type: string
                      log:
                        type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                compiledRulesCount:
                  type: integer
                activeEndpoints:
                  type: integer
---
