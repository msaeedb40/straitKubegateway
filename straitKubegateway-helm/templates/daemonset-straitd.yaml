apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "straitKubegateway.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "straitKubegateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "straitKubegateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "straitKubegateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "straitKubegateway.agentServiceAccount" . }}
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        {{- toYaml .Values.agent.tolerations | nindent 8 }}
      initContainers:
        - name: install-cni
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Installing strait CNI plugin to {{ .Values.agent.cni.binDir }}..."
              cp /usr/local/bin/cni {{ .Values.agent.cni.binDir }}/strait || cp /bin/cni {{ .Values.agent.cni.binDir }}/strait || cp /cni {{ .Values.agent.cni.binDir }}/strait
              chmod +x {{ .Values.agent.cni.binDir }}/strait
              echo "Writing {{ .Values.agent.cni.confDir }}/{{ .Values.agent.cni.confFileName }}..."
              cp /etc/strait/cni-conf.json {{ .Values.agent.cni.confDir }}/{{ .Values.agent.cni.confFileName }}
          volumeMounts:
            - name: cni-bin
              mountPath: {{ .Values.agent.cni.binDir }}
            - name: cni-conf
              mountPath: {{ .Values.agent.cni.confDir }}
            - name: config
              mountPath: /etc/strait
      containers:
        - name: straitd
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
                - BPF
                - NET_RAW
                - SYS_RESOURCE
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: STRAIT_CONFIG
              value: /etc/strait/config.json
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: bpf-maps
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: cgroup
              mountPath: /sys/fs/cgroup
              mountPropagation: Bidirectional
            - name: run-strait
              mountPath: /var/run/strait
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: config
              mountPath: /etc/strait
      volumes:
        - name: bpf-maps
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: run-strait
          hostPath:
            path: /var/run/strait
            type: DirectoryOrCreate
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: cni-bin
          hostPath:
            path: {{ .Values.agent.cni.binDir }}
            type: DirectoryOrCreate
        - name: cni-conf
          hostPath:
            path: {{ .Values.agent.cni.confDir }}
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: {{ include "straitKubegateway.fullname" . }}-config
