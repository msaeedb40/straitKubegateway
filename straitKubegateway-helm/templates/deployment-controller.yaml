apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "straitKubegateway.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "straitKubegateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "straitKubegateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "straitKubegateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "straitKubegateway.controllerServiceAccount" . }}
      containers:
        - name: sg-controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          command:
            - /usr/local/bin/sg-controller
          args:
            - --leader-elect={{ .Values.controller.leaderElection.enabled }}
            - --grpc-port={{ .Values.controller.grpc.port }}
            - --metrics-port={{ .Values.controller.metrics.port }}
            - --config=/etc/strait/config.json
          ports:
            - name: grpc
              containerPort: {{ .Values.controller.grpc.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.controller.metrics.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/strait
      volumes:
        - name: config
          configMap:
            name: {{ include "straitKubegateway.fullname" . }}-config
