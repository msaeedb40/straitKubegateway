{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "straitKubegateway.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "straitKubegateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: {{ .Values.ui.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "straitKubegateway.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
{{- end }}
